<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#4754d6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background tile -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Outer halo -->
  <circle cx="256" cy="256" r="180" fill="url(#halo)"/>

  <!-- Compass star: four diagonal lobes (smaller, dimmer) -->
  <g fill="#e5ecff" opacity="0.7">
    <polygon points="256,256 168,168 248,232"/>
    <polygon points="256,256 344,168 264,232"/>
    <polygon points="256,256 344,344 264,280"/>
    <polygon points="256,256 168,344 248,280"/>
  </g>

  <!-- Compass star: four cardinal lobes (long, bright) -->
  <g fill="#ffffff">
    <polygon points="256,80 290,242 256,256 222,242"/>
    <polygon points="256,432 290,270 256,256 222,270"/>
    <polygon points="80,256 242,290 256,256 242,222"/>
    <polygon points="432,256 270,290 256,256 270,222"/>
  </g>

  <!-- Center glow + dot -->
  <circle cx="256" cy="256" r="40" fill="url(#centerGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <circle cx="256" cy="256" r="6" fill="#4754d6"/>
</svg>
