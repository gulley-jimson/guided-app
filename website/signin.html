<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Guided</title>
    <meta name="description" content="Sign in to your Guided account." />
    <meta name="theme-color" content="#0b0d10" />
    <style>
      html.is-locked body > *:not(#gate-overlay) { display: none !important; }
      #gate-overlay {
        position: fixed; inset: 0; z-index: 999999;
        background: #0f0f13;
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        color: #e6e8eb;
      }
      #gate-overlay .gate-card {
        width: 100%; max-width: 360px;
        padding: 32px;
        background: #15181d;
        border: 1px solid #23272e;
        border-radius: 14px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      }
      #gate-overlay .gate-logo {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; margin-bottom: 24px;
      }
      #gate-overlay .gate-mark {
        width: 32px; height: 32px;
        border-radius: 9px;
        background: linear-gradient(135deg, #a78bfa, #6366f1);
        display: grid; place-items: center;
        box-shadow: 0 6px 20px rgba(167, 139, 250, 0.35);
      }
      #gate-overlay .gate-mark svg { width: 20px; height: 20px; color: #fff; }
      #gate-overlay .gate-name {
        font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
      }
      #gate-overlay input {
        width: 100%; box-sizing: border-box;
        padding: 12px 14px;
        background: #0b0d10;
        border: 1px solid #2f3441;
        border-radius: 8px;
        color: #e6e8eb;
        font-size: 14px; outline: none;
        margin-bottom: 12px;
      }
      #gate-overlay input:focus { border-color: #a78bfa; }
      #gate-overlay button {
        width: 100%; padding: 12px;
        background: #a78bfa; color: #0b0d10;
        border: none; border-radius: 8px;
        font-size: 14px; font-weight: 600; cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
      }
      #gate-overlay button:hover { background: #8b5cf6; color: #fff; }
      @keyframes gateShake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
      }
      #gate-overlay .gate-card.shake {
        animation: gateShake 0.4s ease-in-out;
        border-color: #f87171;
      }

      .signin-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 32px 0;
      }
      #clerk-mount {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .signin-fallback {
        color: var(--text-muted);
        text-align: center;
      }
    </style>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('guided.unlocked') === 'true') return;
        } catch (e) {}
        document.documentElement.classList.add('is-locked');

        function build() {
          var overlay = document.createElement('div');
          overlay.id = 'gate-overlay';
          overlay.innerHTML =
            '<form class="gate-card" autocomplete="off">' +
            '<div class="gate-logo">' +
            '<span class="gate-mark">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="12" cy="12" r="3" />' +
            '<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" />' +
            '</svg>' +
            '</span>' +
            '<span class="gate-name">Guided</span>' +
            '</div>' +
            '<input type="password" name="p" placeholder="Password" autocomplete="off" autofocus />' +
            '<button type="submit">Enter</button>' +
            '</form>';
          document.body.insertBefore(overlay, document.body.firstChild);
          var card = overlay.querySelector('.gate-card');
          var form = overlay.querySelector('form');
          var input = overlay.querySelector('input');
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (input.value === 'gulley_guided2026') {
              try { sessionStorage.setItem('guided.unlocked', 'true'); } catch (err) {}
              document.documentElement.classList.remove('is-locked');
              overlay.remove();
            } else {
              card.classList.remove('shake');
              void card.offsetWidth;
              card.classList.add('shake');
              input.value = '';
              input.focus();
            }
          });
          setTimeout(function () { input.focus(); }, 0);
        }

        if (document.body) build();
        else document.addEventListener('DOMContentLoaded', build, { once: true });
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>

    <script
      data-clerk-publishable-key="pk_test_cHJvcGVyLWJhdC00LmNsZXJrLmFjY291bnRzLmRldiQ"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript">
    </script>
    <script>
      (function () {
        var CLERK_KEY = 'pk_test_cHJvcGVyLWJhdC00LmNsZXJrLmFjY291bnRzLmRldiQ';

        function getQueryParams() {
          try { return new URLSearchParams(window.location.search); } catch (e) { return new URLSearchParams(); }
        }

        function isAppFlow() {
          return getQueryParams().get('source') === 'app';
        }

        function getRedirectUrl() {
          if (isAppFlow()) {
            // Stay on this page so we can capture the session token after sign-in
            // and bounce to the guided:// deep link.
            return window.location.href;
          }
          try {
            var params = getQueryParams();
            var dest = params.get('redirect') || 'account';
            var plan = params.get('plan');
            if (dest === 'pricing') {
              return 'pricing.html' + (plan ? '?plan=' + encodeURIComponent(plan) : '');
            }
            if (dest === 'index' || dest === 'home') return 'index.html';
            return 'account.html';
          } catch (e) {
            return 'account.html';
          }
        }

        async function ensureClerk() {
          if (typeof window.Clerk === 'undefined') {
            await new Promise(function (resolve) {
              var attempts = 0;
              var t = setInterval(function () {
                attempts += 1;
                if (typeof window.Clerk !== 'undefined' || attempts > 50) {
                  clearInterval(t);
                  resolve();
                }
              }, 100);
            });
          }
          if (typeof window.Clerk === 'undefined') {
            throw new Error('Clerk failed to load.');
          }
          // Clerk's CDN bundle auto-instantiates window.Clerk as a singleton.
          // The publishable key comes from the data-clerk-publishable-key attribute
          // on the script tag, so load() is called with no args.
          var clerk = window.Clerk;
          if (!clerk.loaded) {
            await clerk.load();
          }
          return clerk;
        }

        async function handleAppDeepLink(clerk) {
          var mount = document.getElementById('clerk-mount');
          if (mount) {
            mount.innerHTML = '<p class="signin-fallback">Returning to Guided…</p>';
          }
          try {
            var token = await clerk.session.getToken();
            var user = clerk.user;
            var email = user && user.primaryEmailAddress ? user.primaryEmailAddress.emailAddress : '';
            var userId = user ? user.id : '';

            var deepLink = 'guided://auth-callback' +
              '?token=' + encodeURIComponent(token || '') +
              '&userId=' + encodeURIComponent(userId) +
              '&email=' + encodeURIComponent(email);

            // Trigger the deep link first — the OS will prompt the user to open Guided.
            window.location.href = deepLink;

            // Then move the tab to the success page so the user has somewhere clean to land.
            setTimeout(function () {
              window.location.href = 'auth-success.html';
            }, 1500);
          } catch (err) {
            if (mount) {
              mount.innerHTML = '<p class="signin-fallback" style="color: #f87171;">' +
                (err.message || 'Could not return to Guided.') + '</p>';
            }
          }
        }

        (async function init() {
          var mount = document.getElementById('clerk-mount');
          var appFlow = isAppFlow();
          var redirectUrl = getRedirectUrl();
          try {
            var clerk = await ensureClerk();

            if (clerk.user) {
              if (appFlow) {
                handleAppDeepLink(clerk);
              } else {
                window.location.href = redirectUrl;
              }
              return;
            }

            mount.innerHTML = '';
            clerk.mountSignIn(mount, {
              afterSignInUrl: redirectUrl,
              afterSignUpUrl: redirectUrl,
              redirectUrl: redirectUrl,
            });

            // Watch the session — once signed in, either bounce to the deep link (app flow)
            // or follow the normal web redirect.
            clerk.addListener(function (resources) {
              if (resources && resources.user) {
                if (appFlow) {
                  handleAppDeepLink(clerk);
                } else {
                  window.location.href = redirectUrl;
                }
              }
            });
          } catch (err) {
            mount.innerHTML = '<p class="signin-fallback" style="color: #f87171;">' +
              (err.message || 'Could not load sign-in.') + '</p>';
          }
        })();
      })();
    </script>
  </body>
